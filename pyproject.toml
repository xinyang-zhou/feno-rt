[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "feno-rt"
version = "0.9.0.dev0"
description = "Focused cache-aware inference runtime with dynamic batching and CUDA Graphs"
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "FENO-RT contributors"}]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24,<3",
  "torch>=2.5,<2.9",
  "kappamodules>=0.1.112,<0.2",
]

[project.urls]
Homepage = "https://github.com/xinyang-zhou/feno-rt"
Repository = "https://github.com/xinyang-zhou/feno-rt"
Issues = "https://github.com/xinyang-zhou/feno-rt/issues"

[tool.setuptools.packages.find]
include = ["feno_rt*"]
