name: tests

on:
  push:
  pull_request:

jobs:
  cpu:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - name: Install CPU runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements/runtime.lock
          python -m pip install -e . --no-deps
      - name: Run CPU and policy tests
        run: python -m unittest discover -s tests -v
      - name: Audit inference-only release boundary
        run: python scripts/audit_public_release.py
      - name: Run public Stage 6 replay smoke benchmark
        run: python benchmarks/benchmark_stage6_replay.py --output /tmp/stage6-replay.json
      - name: Verify source and wheel builds
        run: |
          python -m pip install build
          python -m build
